types:
  - name: "sensor_msgs/msg/JointState"
    fields:
      - "std_msgs/msg/Header header"
      - "string[] name"
      - "double[] position"
      - "double[] velocity"
      - "double[] effort"
  - name: "std_msgs/msg/Header"
    fields:
      - "builtin_interfaces/msg/Time stamp"
      - "string frame_id"
  - name: "builtin_interfaces/msg/Time"
    fields:
      - "int32 sec"
      - "uint32 nanosec"

interfaces:
  - internal_interface: "ros_action_client"
    internal_name: "/gripper/gripper_action_controller/gripper_cmd"
    internal_type: "control_msgs/action/ParallelGripperCommand"
    type_hash: "RIHS01_388b0a9cb34b22db9c6d67b752df85e173f40d6ad1d2a13824f114620f4d3fa1"
    external_interface: "zenoh_queryable_proto"
    external_name: "gripper_cmd"
    external_type: "control_msgs.action.ParallelGripperCommand"
    request_fields:
      - "sensor_msgs/msg/JointState command"
      - "string action_name"
    response_fields:
      - "sensor_msgs/msg/JointState state"
      - "bool stalled"
      - "bool reached_goal"

targets:
  sim:
    type: "launch"
    package: "hande_gripper_sim_driver"
    name: "hande_gripper.launch.xml"
    prune:
      patterns:
        - "/usr/include"
        - "/usr/share/python-babel-localedata"
        - "/usr/share/fonts"
        - "/usr/share/cmake-4.2"
        - "/usr/share/doc"
        - "/usr/share/man"
        - "/usr/lib/ruby"
        - "/usr/bin/ruby*"
  real:
    type: "launch"
    package: "hande_gripper_aquarium"
    name: "hande_gripper.launch.xml"
    rosdep:
      skip:
        - "urdf_launch"
        - "ros2_control_test_assets"
    prune:
      patterns:
        - "/usr/include"
        - "/usr/share/python-babel-localedata"
        - "/usr/share/fonts"
        - "/usr/share/cmake-4.2"
        - "/usr/share/doc"
        - "/usr/share/man"
        - "/usr/lib/ruby"
        - "/usr/bin/ruby*"


