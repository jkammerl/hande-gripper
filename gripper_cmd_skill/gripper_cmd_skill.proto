syntax = "proto3";

package ai.intrinsic;

// Mirrors of the ROS 2 messages used by control_msgs/action/ParallelGripperCommand.
// The field numbers follow the order of the ROS message fields, which is how
// the gripper service's gateway maps between the two.

// builtin_interfaces/msg/Time
message Time {
  int32 sec = 1;
  uint32 nanosec = 2;
}

// std_msgs/msg/Header
message Header {
  Time stamp = 1;
  string frame_id = 2;
}

// sensor_msgs/msg/JointState
message JointState {
  Header header = 1;
  repeated string name = 2;
  repeated double position = 3;
  repeated double velocity = 4;
  repeated double effort = 5;
}

// The action goal. Sent to the gateway as the query payload.
message GripperCmdParams {
  // Target joint state, e.g. the finger joint's position in meters.
  JointState command = 1;
  // ROS action server to use instead of the gateway's default one.
  string action_name = 2;
}

// The action result, as replied by the gateway.
message GripperCmdResult {
  // Terminal action status, e.g. "SUCCEEDED", or "FAILED: <reason>".
  string status = 1;
  JointState state = 2;
  bool stalled = 3;
  bool reached_goal = 4;
}
